name: FishbowlBot — Book Rooms

on:
  schedule:
    # Midnight Pacific time = 8:00 UTC (PST) or 7:00 UTC (PDT)
    # Running at both to cover daylight saving time automatically
    - cron: "0 7 * * *" # PDT (summer, UTC-7)
    - cron: "0 8 * * *" # PST (winter, UTC-8)
  workflow_dispatch: # also lets you trigger it manually from GitHub UI

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Write emails.csv from secret
        run: echo "${{ secrets.EMAILS_CSV }}" > emails.csv

      - name: Run booking bot
        run: python submitTime.py

      - name: Upload booking log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-log-${{ github.run_id }}
          path: booking_log.txt
          if-no-files-found: ignore
